<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Molecular Foundry</title>
  <meta name="description" content="Simulate a company that makes the world's materials from sunlight, seawater, air and rock.">
  <!-- Link previews (Slack, X, iMessage…). og-image.png comes from scripts/build-og-image.mjs. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Molecular Foundry">
  <meta property="og:title" content="Molecular Foundry: making the world's materials from sunlight">
  <meta property="og:description" content="How much of the world's material tonnage could a solar-powered company make below today's price from sunlight, seawater, air and rock, and what blocks the rest? An interactive screening model.">
  <meta property="og:url" content="https://akarshgopal.github.io/ultimat-sim/">
  <meta property="og:image" content="https://akarshgopal.github.io/ultimat-sim/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The Abundance view: share of world material tonnage feasible below today's price, today and at the frontier.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="css/abundance.css">
  <link rel="stylesheet" href="css/company.css">
  <link rel="stylesheet" href="css/energy.css">
  <link rel="stylesheet" href="css/designs.css">
  <link rel="stylesheet" href="css/pathways.css">
  <link rel="stylesheet" href="css/plant.css">
  <link rel="stylesheet" href="css/sites.css">
  <link rel="stylesheet" href="css/markets.css">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="#/abundance" data-view="abundance">Molecular Foundry</a>
    <nav class="app-nav" aria-label="Views"></nav>
    <span class="header-spacer"></span>
    <span class="sim-status" id="simStatus" role="status"></span>
    <button class="icon-button" id="pinBtn" type="button" title="Keep this scenario as a baseline and compare as you change things">Pin to compare</button>
    <button class="icon-button" id="copyLink" type="button" title="Copy a link to this page with the current scenario">Copy link</button>
    <button class="icon-button" id="themeToggle" type="button">Dark</button>
  </header>
  <div class="compare-bar" id="compareBar" role="status" hidden></div>
  <main id="view" class="app-main"></main>

  <!-- data -->
  <script src="data/pathways.js"></script>
  <script src="data/markets.js"></script>
  <script src="data/sites.js"></script>
  <script src="data/bom.js"></script>
  <!-- engine -->
  <script src="engine/utilization.js"></script>
  <script src="engine/company.js"></script>
  <script src="engine/plant-design.js"></script>
  <script src="engine/designs/electrolyzer.js"></script>
  <script src="engine/designs/haber-bosch.js"></script>
  <script src="engine/designs/dri-shaft.js"></script>
  <script src="engine/designs/pellet-plant.js"></script>
  <script src="engine/designs/dac.js"></script>
  <script src="engine/designs/synthesis.js"></script>
  <script src="engine/designs/urea.js"></script>
  <script src="engine/designs/smelter.js"></script>
  <!-- ui -->
  <script src="js/ui/kit.js"></script>
  <script src="js/ui/charts.js"></script>
  <script src="js/store.js"></script>
  <script>globalThis.Views = {};</script>
  <!-- views -->
  <script src="js/views/abundance.js"></script>
  <script src="js/views/company.js"></script>
  <script src="js/views/energy.js"></script>
  <script src="js/views/designs.js"></script>
  <script src="js/views/pathways.js"></script>
  <script src="js/views/plant.js"></script>
  <script src="js/views/sites.js"></script>
  <script src="js/views/markets.js"></script>
  <!-- shell (last) -->
  <script src="js/app.js"></script>
</body>
</html>
